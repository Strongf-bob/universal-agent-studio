name: Slice 1 Executable Spine

"on":
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  executable-spine:
    name: Contracts, runtime, security and browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://uas:uas-test-only@127.0.0.1:55432/uas_test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: "11.7.0"
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: pnpm

      - name: Install locked dependencies
        run: |
          uv sync --all-packages --frozen
          pnpm install --frozen-lockfile
          pnpm --filter @universal-agent-studio/studio-web exec playwright install --with-deps chromium

      - name: Start isolated integration PostgreSQL
        run: |
          docker run --detach \
            --name uas-slice1-ci-postgres \
            --env POSTGRES_DB=uas_test \
            --env POSTGRES_USER=uas \
            --env POSTGRES_PASSWORD=uas-test-only \
            --publish 127.0.0.1:55432:5432 \
            postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
          for attempt in $(seq 1 30); do
            if docker exec uas-slice1-ci-postgres pg_isready -U uas -d uas_test; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Check generated code, lint and types
        run: pnpm check

      - name: Run contract and unit suites
        run: |
          pnpm test:contracts
          pnpm test:web
          uv run pytest -q

      - name: Build the local application images
        run: docker compose -f infra/docker/compose.local.yml build

      - name: Start the complete local stack
        run: pnpm dev:local

      - name: Prove browser and security acceptance
        run: |
          pnpm test:e2e
          uv run pytest tests/security tests/integration -q

      - name: Collect redacted service logs
        if: failure()
        run: node scripts/collect-redacted-logs.mjs

      - name: Stop the local stack
        if: always()
        run: |
          if [ -d .local/secrets ]; then
            pnpm local:down
          fi

      - name: Remove the integration database
        if: always()
        run: docker rm --force uas-slice1-ci-postgres || true
